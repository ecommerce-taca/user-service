spring:
  datasource:
    url: jdbc:mysql://localhost:3306/userdb_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&tinyInt1isBit=false
    username: ecommerce
    password: ecommerce

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  audit:
    hash-key-base64: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  
  outbox:
    encryption-key-base64: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info