name: auth-user

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile

    image: taca/auth-user-service:local

    ports:
      - "127.0.0.1:8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8081

      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-userdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&tinyInt1isBit=false"
      DB_USERNAME: "${MYSQL_USER:-ecommerce}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CONNECT_TIMEOUT: 2s
      REDIS_TIMEOUT: 2s

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      AUTH_OUTBOX_ENCRYPTION_KEY_BASE64: "${AUTH_OUTBOX_ENCRYPTION_KEY_BASE64:?Missing AUTH_OUTBOX_ENCRYPTION_KEY_BASE64}"
      AUTH_AUDIT_HASH_KEY_BASE64: "${AUTH_AUDIT_HASH_KEY_BASE64:?Missing AUTH_AUDIT_HASH_KEY_BASE64}"
      AUTH_OTP_HASH_KEY_BASE64: "${AUTH_OTP_HASH_KEY_BASE64:?Missing AUTH_OTP_HASH_KEY_BASE64}"
      AUTH_MFA_ENCRYPTION_KEY_BASE64: "${AUTH_MFA_ENCRYPTION_KEY_BASE64:?Missing AUTH_MFA_ENCRYPTION_KEY_BASE64}"

      AUTH_JWT_PRIVATE_KEY_BASE64: "${AUTH_JWT_PRIVATE_KEY_BASE64:?Missing AUTH_JWT_PRIVATE_KEY_BASE64}"
      AUTH_JWT_PUBLIC_KEY_BASE64: "${AUTH_JWT_PUBLIC_KEY_BASE64:?Missing AUTH_JWT_PUBLIC_KEY_BASE64}"
      JWT_KEY_ID: "${JWT_KEY_ID:-auth-user-key-local-1}"

      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    restart: unless-stopped

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-userdb}"
      MYSQL_USER: "${MYSQL_USER:-ecommerce}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"

    volumes:
      - auth_user_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0

    ports:
      - "127.0.0.1:19092:19092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.0

    depends_on:
      kafka:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notification.commands.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic user.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic shop.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic auth-user.events.dlq.v1 --partitions 3 --replication-factor 1

    restart: "no"

volumes:
  auth_user_mysql_data: